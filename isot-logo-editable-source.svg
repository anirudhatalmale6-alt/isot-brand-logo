<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 670" width="600" height="670">
<defs>
<path id="topArc" d="M 70,300 A 230,230 0 0 1 530,300"/>
<path id="botArc" d="M 32,300 A 268,268 0 0 0 568,300"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Roboto+Slab:wght@700;800;900&amp;display=swap');
.ring{font-family:'Oswald',sans-serif;font-weight:600;fill:#ffffff;font-size:52px;letter-spacing:2px;}
.ringb{font-family:'Oswald',sans-serif;font-weight:600;fill:#ffffff;font-size:56px;letter-spacing:6px;}
.isot{font-family:'Roboto Slab',serif;font-weight:800;fill:#15305a;}
.rib{font-family:'Oswald',sans-serif;font-weight:600;font-size:35px;letter-spacing:0.5px;}
</style>
</defs>

<!-- seal base: navy disc, red pinstripes, white interior -->
